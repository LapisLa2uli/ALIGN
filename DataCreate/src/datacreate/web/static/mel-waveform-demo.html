<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Audio → live mel waveform</title>
<style>
  body { max-width: 800px; margin: 60px auto; padding: 20px; background: #f7f8f2; color: #243d38; font: 16px system-ui; }
  canvas { display: block; width: 100%; height: 260px; margin: 24px 0; background: #fffef9; border-radius: 16px; }
  audio { width: 100%; margin: 20px 0; }
  button { padding: 10px 20px; margin-left: 12px; cursor: pointer; }
  #status { min-height: 24px; }
</style>
<h1>Hear it. See it.</h1>
<p>Choose an audio file, then press Play. The bars follow its live mel-frequency energy.</p>
<label>Audio file <input id="file" type="file" accept="audio/*"></label>
<button id="play" disabled>Play</button>
<canvas id="waveform" aria-label="Live mel-frequency energy visualization"></canvas>
<audio id="audio" controls></audio>
<p id="status" role="status"></p>
<script type="module">
  import { createMelWaveform } from './mel-waveform.js';

  const audio = document.querySelector('#audio');
  const canvas = document.querySelector('#waveform');
  const play = document.querySelector('#play');
  const status = document.querySelector('#status');
  let waveform, objectURL;

  document.querySelector('#file').addEventListener('change', event => {
    const file = event.target.files[0];
    if (!file) return;
    audio.pause();
    if (objectURL) URL.revokeObjectURL(objectURL);
    objectURL = URL.createObjectURL(file);
    audio.src = objectURL;
    play.disabled = false;
    status.textContent = file.name;
  });

  async function activate() {
    waveform ??= createMelWaveform(audio, canvas);
    await waveform.resume();
  }

  play.addEventListener('click', async () => {
    try { await activate(); await audio.play(); }
    catch { status.textContent = 'Could not play this file. Try WAV or MP3.'; }
  });
  // Also support the native audio player's play button.
  audio.addEventListener('play', () => {
    activate().catch(() => { status.textContent = 'Press Play above to enable audio.'; });
  });
  audio.addEventListener('error', () => { status.textContent = 'This audio format could not be decoded by your browser.'; });
  window.addEventListener('pagehide', () => {
    // Keep the graph intact when the browser caches this page for Back navigation.
    audio.pause();
  });
</script>
</html>
