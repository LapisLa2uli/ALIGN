[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "datacreate"
version = "0.1.0"
description = "Music performance error-annotation data creation pipeline"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "music21>=9.1",
  "librosa>=0.10",
  "numpy>=1.24",
  "scipy>=1.11",
  "matplotlib>=3.8",
  "pyyaml>=6.0",
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "python-multipart>=0.0.9",
  "jinja2>=3.1",
  "pydantic>=2.6",
  "jsonschema>=4.21",
  "aiofiles>=23.2",
]

[project.scripts]
datacreate = "datacreate.cli:main"
datacreate-batch = "datacreate.cli:batch_main"
datacreate-synthetic = "datacreate.cli:synthetic_main"
datacreate-validate = "datacreate.cli:validate_main"
datacreate-serve = "datacreate.cli:serve_main"

[tool.setuptools.packages.find]
where = ["src"]
