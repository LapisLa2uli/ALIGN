schema_version: "1.2"

paths:
  musescore: C:/Program Files/MuseScore 4/bin/MuseScore4.exe
  soundfont: C:/Program Files/MuseScore 4/sound/MS Basic.sf3
  output_root: ./output
  datacreate_config: ../DataCreate/config/default.yaml

audio:
  sample_rate: 22050
  mono: true

musescore:
  min_version: "4.2.0"
  synthesizer_gain_db: -6
  tail_seconds: 2.0
  render_chunk_size: 4096

render:
  midi_backend: music21   # music21 only for the default path; musescore is optional
  soundfont: freepats     # freepats | u220 | mcb | msbasic
  sounding_transpose: -2  # Bb clarinet: written C sounds Bb

generation:
  measures_min: 8
  measures_max: 16
  meters:
    - [4, 4]
    - [3, 4]
    - [2, 4]
    - [6, 8]
  keys:
    - {tonic: C, mode: major}
    - {tonic: G, mode: major}
    - {tonic: F, mode: major}
    - {tonic: D, mode: major}
    - {tonic: Bb, mode: major}
    - {tonic: Eb, mode: major}
    - {tonic: A, mode: minor}
    - {tonic: E, mode: minor}
    - {tonic: D, mode: minor}
    - {tonic: G, mode: minor}
  tempo_min: 72
  tempo_max: 112
  pitch_min: E3
  pitch_max: C6
  rest_probability: 0.08
  syncopation_prob: 0.12   # chance a duration does not land the next onset on a beat

errors:
  weights:
    wrong_note: 1.0
    missed_note: 1.0
    extra_note: 1.0
    rhythm_error: 1.0
    intonation_error: 1.0
  per_clip_min: 1          # errors planted per clip
  per_clip_max: 1
  repetition_prob: 0.35    # after errors, chance to replay the measure(s) that contain them
  standalone_repetition_prob: 0.0  # repeat a measure with no prior error
  repeat_gap_seconds: [0.0, 0.0]   # silence before a restart; use [0.2, 1.0] to simulate adjusting
  repeat_extra_copies_weights:
    1: 0.7                 # one extra play (two total)
    2: 0.3                 # two extra plays (three total)
  melody_pad_notes: [1, 2] # notes of padding on each side of the gold melody
  repeat_window: measure
  squeak:
    prob: 0.0              # chance a wrong/extra note is a high squeak
    pitch_min: C6
    pitch_max: A7
  rhythm_kinds:
    - late_start
    - early_start
    - late_end
    - early_end
    - tempo_change
    - uneven
  intonation:
    cents_min: 40          # clearly off, still the same pitch class (< 100)
    cents_max: 80
    group_prob: 0.45       # chance to detune a consecutive run instead of one note
    group_max: 4
