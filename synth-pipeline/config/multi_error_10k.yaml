schema_version: "1.2"

paths:
  musescore: C:/Program Files/MuseScore 4/bin/MuseScore4.exe
  soundfont: C:/Program Files/MuseScore 4/sound/MS Basic.sf3
  output_root: ./output_10k_multi
  datacreate_config: ../DataCreate/config/default.yaml

audio:
  sample_rate: 22050
  mono: true

musescore:
  min_version: "4.2.0"
  synthesizer_gain_db: -6
  tail_seconds: 2.0
  render_chunk_size: 4096

render:
  midi_backend: music21
  soundfont: freepats

generation:
  measures_min: 8
  measures_max: 16
  meters:
    - [4, 4]
    - [3, 4]
    - [2, 4]
    - [6, 8]
  keys:
    - {tonic: C, mode: major}
    - {tonic: G, mode: major}
    - {tonic: F, mode: major}
    - {tonic: D, mode: major}
    - {tonic: Bb, mode: major}
    - {tonic: Eb, mode: major}
    - {tonic: A, mode: minor}
    - {tonic: E, mode: minor}
    - {tonic: D, mode: minor}
    - {tonic: G, mode: minor}
  tempo_min: 72
  tempo_max: 112
  pitch_min: E3
  pitch_max: C6
  rest_probability: 0.12
  syncopation_prob: 0.12

errors:
  # Five planted types are equally likely. A clip has 1-8 of them.
  # Repetition is usually attached after those errors; otherwise it can appear alone.
  # That keeps the six types in roughly the same overall counts.
  weights:
    wrong_note: 1.0
    missed_note: 1.0
    extra_note: 1.0
    rhythm_error: 1.0
    intonation_error: 1.0
  per_clip_min: 1
  per_clip_max: 8
  repetition_prob: 0.80
  standalone_repetition_prob: 0.20
  repeat_gap_seconds: [0.2, 1.0]
  repeat_extra_copies_weights:
    1: 0.7
    2: 0.3
  melody_pad_notes: [1, 2]
  repeat_window: measure
  squeak:
    prob: 0.22
    pitch_min: C6
    pitch_max: A7
  rhythm_kinds:
    - late_start
    - early_start
    - late_end
    - early_end
    - tempo_change
    - uneven
  intonation:
    cents_min: 40
    cents_max: 80
    group_prob: 0.45
    group_max: 4
