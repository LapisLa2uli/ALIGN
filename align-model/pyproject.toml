[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "alignmodel"
version = "0.1.0"
description = "RUMAA-lite score-informed error detector for ALIGN clarinet bundles"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "torch>=2.2",
  "numpy>=1.24",
  "music21>=9.1",
  "pyyaml>=6.0",
]

[project.scripts]
align-model = "alignmodel.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
